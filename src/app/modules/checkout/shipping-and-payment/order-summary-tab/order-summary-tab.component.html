<div class="border bg-light p-4 rounded-1 mb-4">
  <div class="fs-4 mb-4 mt-1 pb-4 border-bottom border-1">Zamówienie</div>

  <div class="mb-4">
    <div class="d-inline-block fs-6 fw-bold">Produkty ({{basketAmount}})</div>
    <div class="d-inline-block fs-7 fw-bold float-end" routerLink="/checkout">Edytuj koszyk</div>
  </div>

  <div *ngFor="let basketItem of basketItems">
    <div>
      <app-ordered-products-list [basketItem]="basketItem"></app-ordered-products-list>
    </div>
  </div>

  <div class="mt-4 mb-4 border-bottom border-1"></div>
  <div>
    <div class="fs-6 mb-2">
      <div class="d-inline-block">Wartość Produktów</div>
      <div class="d-inline-block float-end">{{totalPrice | currency: 'zł': 'code'}}</div>
    </div>
    <div class="fs-6">
      <div class="d-inline-block">Dostawa</div>
      <div class="d-inline-block float-end">20zł</div>
    </div>
  </div>
  <div class="mt-4 mb-4 border-bottom border-1"></div>
  <div>
    Kod rabatowy
  </div>
  <div class="mt-4 mb-4 border-bottom border-1"></div>
  <div class="mb-4 fs-5">
    <div class="d-inline-block">Łącznie (z Vat)</div>
    <div class="d-inline-block float-end">1000zł</div>
  </div>
  <button mat-raised-button class="w-100" color="primary">Zamawiam i płacę</button>
</div>
