<div class="border bg-light p-4 rounded-1 mb-4">
  <div class="fs-4 mb-4 mt-1">Dane klienta</div>
  <div class="d-inline-flex align-items-center mb-4">
    <mat-icon>account_circle</mat-icon> <span class="ps-2">Zaloguj się / Zarejestruj się przyspieszy to proces zamówienia!</span>
  </div>
<!--<app-customer-data-tab></app-customer-data-tab>-->

    <div class="">
      <form [formGroup]="check">
        <mat-checkbox class="d-block" color="primary" [formControl]="check.controls.invoice">Zamówienie z fakturą VAT</mat-checkbox>
        <mat-checkbox class="d-block" color="primary" [formControl]="check.controls.shippingAdditionalData">Dostawa pod inny adres</mat-checkbox>
      </form>
      <ng-container *ngIf="showForm">
        <div class="fs-4 mb-4 mt-3">Dane dostawy</div>
<!--        <app-customer-data-tab></app-customer-data-tab>-->
      </ng-container>
    </div>
  <div class="d-inline-flex w-100">
    <div class="mt-3">* pola obowiązkowe</div>
    <div class="ms-auto mt-auto">
      <button mat-raised-button color="primary">Kontynuuj</button>
    </div>
  </div>
</div>
